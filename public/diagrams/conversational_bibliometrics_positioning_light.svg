  <title
     id="title1">Conversational bibliometrics — a positioning map</title>
  <desc
     id="desc1">A 2x2 map. Horizontal axis: where methodological authority sits, from model fluency to explicit rules and workflows. Vertical axis: how constraints are applied, from advisory to enforced. Systems are placed across the quadrants; the AI metascientist sits in the top-right governed-execution zone, with a trajectory arrow from DimQuery showing the move from communicating rules to enforcing them.</desc>
