<svg width="100%" viewBox="0 0 700 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Conversational bibliometrics — a positioning map</title>
<desc>A 2x2 map. Horizontal axis: where methodological authority sits, from model fluency to explicit rules and workflows. Vertical axis: how constraints are applied, from advisory to enforced. Systems are placed across the quadrants; the AI metascientist sits in the top-right governed-execution zone, with a trajectory arrow from DimQuery showing the move from communicating rules to enforcing them.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
text{font-family:"Anthropic Sans",-apple-system,system-ui,"Segoe UI",sans-serif;}
.ttl{font-size:14px;font-weight:500;}
.sub{font-size:12px;font-weight:400;}
.sm{font-size:11px;font-weight:400;}
.nt{font-size:10px;font-weight:400;}
</style>
</defs>

<!-- header -->
<text x="350" y="28" class="ttl" fill="#141413" text-anchor="middle">Conversational bibliometrics — a positioning map</text>
<text x="350" y="46" class="sub" fill="#3D3D3A" text-anchor="middle">where a system puts methodological authority, and whether that authority is enforced</text>

<!-- legend -->
<circle cx="160" cy="66" r="5" fill="#534AB7"/>
<text x="172" y="70" class="sm" fill="#3D3D3A">Hélène's systems</text>
<circle cx="300" cy="66" r="5" fill="#FFFFFF" stroke="#737470" stroke-width="1.5"/>
<text x="312" y="70" class="sm" fill="#3D3D3A">other approaches</text>
<rect x="440" y="60" width="14" height="12" rx="2" fill="#F2FAF6" stroke="#0F6E56" stroke-width="0.5"/>
<text x="458" y="70" class="sm" fill="#3D3D3A">governed-execution zone</text>

<!-- governed (top-right) tint -->
<rect x="385" y="90" width="235" height="185" fill="#F2FAF6"/>

<!-- plot border + dividers -->
<rect x="150" y="90" width="470" height="370" fill="none" stroke="#C9C7C1" stroke-width="1"/>
<line x1="385" y1="90" x2="385" y2="460" stroke="#E2E0DA" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="150" y1="275" x2="620" y2="275" stroke="#E2E0DA" stroke-width="1" stroke-dasharray="4 3"/>

<!-- quadrant corner labels -->
<text x="160" y="108" class="sm" fill="#94928B">confident, unaccountable</text>
<text x="610" y="108" class="sm" fill="#0F6E56" text-anchor="end">governed execution</text>
<text x="160" y="452" class="sm" fill="#94928B">fluent improvisation</text>
<text x="610" y="452" class="sm" fill="#94928B" text-anchor="end">documented, but ignorable</text>

<!-- axis titles -->
<text x="385" y="492" class="sub" fill="#3D3D3A" text-anchor="middle">Where authority sits:  model fluency  →  explicit rules &amp; workflows</text>
<text x="126" y="275" class="sub" fill="#3D3D3A" text-anchor="middle" transform="rotate(-90 126 275)">How constraints apply:  advisory  →  enforced</text>

<!-- trajectory arrow: DimQuery -> metascientist -->
<path d="M470 330 C 540 300 548 205 560 142" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="505" y="246" class="nt" fill="#534AB7" text-anchor="end">communicate the rules</text>
<text x="505" y="258" class="nt" fill="#534AB7" text-anchor="end">→ enforce them</text>

<!-- systems: other approaches (hollow) -->
<circle cx="220" cy="393" r="5" fill="#FFFFFF" stroke="#737470" stroke-width="1.5"/>
<text x="220" y="409" class="sm" fill="#3D3D3A" text-anchor="middle">direct LLM chat</text>

<circle cx="314" cy="349" r="5" fill="#FFFFFF" stroke="#737470" stroke-width="1.5"/>
<text x="314" y="335" class="sm" fill="#3D3D3A" text-anchor="middle">suggestive co-pilot</text>

<circle cx="408" cy="356" r="5" fill="#FFFFFF" stroke="#737470" stroke-width="1.5"/>
<text x="417" y="360" class="sm" fill="#3D3D3A">custom GPTs / Gems</text>

<circle cx="347" cy="268" r="5" fill="#FFFFFF" stroke="#737470" stroke-width="1.5"/>
<text x="347" y="254" class="sm" fill="#3D3D3A" text-anchor="middle">vibe-coded analysis</text>

<circle cx="488" cy="208" r="5" fill="#FFFFFF" stroke="#737470" stroke-width="1.5"/>
<text x="499" y="205" class="sm" fill="#3D3D3A">SciSciGPT</text>
<text x="499" y="218" class="nt" fill="#94928B">audited, but validity left to user</text>

<!-- systems: Hélène's (filled purple) -->
<circle cx="470" cy="338" r="6" fill="#534AB7"/>
<text x="481" y="342" class="sm" fill="#3C3489">DimQuery</text>

<circle cx="564" cy="127" r="6" fill="#534AB7"/>
<circle cx="564" cy="127" r="10" fill="none" stroke="#534AB7" stroke-width="1"/>
<text x="564" y="150" class="sm" fill="#3C3489" text-anchor="middle" font-weight="500">The AI metascientist</text>
<text x="564" y="164" class="nt" fill="#534AB7" text-anchor="middle">governed core · enforced execution</text>

</svg>
