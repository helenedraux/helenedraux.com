  <title
     id="title1">AV|VA — validation and verification, with risk-proportional routing</title>
  <desc
     id="desc1">Validation happens before the answer: a gate checks whether the task is well-formed and the construct sound, with an off-ramp to reframe or refuse. Four scoping questions — task type, intended use, cost if wrong, and whether it can be checked against a source — produce a risk level of low, medium, or high. Verification happens after the answer: each risk tier routes to a proportional set of checks, from self-critique at low risk up to an independent second model, external source and legal precision, and human review at high risk. All routes converge on a checked output.</desc>
