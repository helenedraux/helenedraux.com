       id="arrow"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M2 1L8 5L2 9"
         fill="none"
         stroke="context-stroke"
         stroke-width="1.5"
         stroke-linecap="round"
         stroke-linejoin="round"
         id="path1" />
    </marker>
    <style
       id="style1">
text{font-family:&quot;Anthropic Sans&quot;,-apple-system,system-ui,&quot;Segoe UI&quot;,sans-serif;}
.ttl{font-size:14px;font-weight:500;}
.sub{font-size:12px;font-weight:400;}
.sm{font-size:11px;font-weight:400;}
.nt{font-size:10px;font-weight:400;}
