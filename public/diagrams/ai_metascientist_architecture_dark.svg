<svg width="100%" viewBox="120 0 515 712" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The AI metascientist — governed architecture</title>
<desc>Conversational interpretation sits at the border as the only AI layer; a governed analytical core (orchestrator, workflow library, deterministic query compiler, MCP gateway) holds methodological authority in rules; validation and human gates check the result before it returns to the user.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
text{font-family:"Anthropic Sans",-apple-system,system-ui,"Segoe UI",sans-serif;}
.ttl{font-size:14px;font-weight:500;text-anchor:middle;}
.sub{font-size:12px;font-weight:400;text-anchor:middle;}
.sm{font-size:11px;font-weight:400;}
.nt{font-size:10px;font-weight:400;}
.ln{fill:none;stroke:#888780;stroke-width:1.5px;}
</style>
</defs>

<!-- header -->
<text x="340" y="28" class="ttl" fill="#E8E6DC">The AI metascientist</text>
<text x="340" y="46" class="sub" fill="#B4B2A9">interpretation at the border · governed analytical core · validated execution</text>

<!-- legend -->
<rect x="150" y="59" width="12" height="12" rx="3" fill="#CECBF6" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="167" y="69" class="sm" fill="#B4B2A9">AI layer</text>
<rect x="258" y="59" width="14" height="12" rx="6" fill="#412402" stroke="#FAC775" stroke-width="0.5"/>
<text x="277" y="69" class="sm" fill="#B4B2A9">human gate</text>
<rect x="392" y="59" width="12" height="12" rx="3" fill="#9FE1CB" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="409" y="69" class="sm" fill="#B4B2A9">governed core</text>

<!-- USER -->
<rect x="250" y="92" width="180" height="44" rx="6" fill="#2C2C2A" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="110" class="ttl" fill="#B4B2A9" dominant-baseline="central">User</text>
<text x="340" y="126" class="sub" fill="#888780" dominant-baseline="central">natural-language question</text>
<line x1="340" y1="136" x2="340" y2="150" class="ln" marker-end="url(#arrow)"/>

<!-- INTERPRETATION (AI) -->
<text x="194" y="166" class="nt" fill="#AFA9EC" text-anchor="end">AI works only</text>
<text x="194" y="178" class="nt" fill="#AFA9EC" text-anchor="end">here, at the border</text>
<rect x="200" y="150" width="280" height="44" rx="6" fill="#CECBF6" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="340" y="168" class="ttl" fill="#CECBF6" dominant-baseline="central">Interpretation layer</text>
<text x="340" y="184" class="sub" fill="#AFA9EC" dominant-baseline="central">interpret intent · route to a workflow</text>
<line x1="340" y1="194" x2="340" y2="208" class="ln" marker-end="url(#arrow)"/>

<!-- gate 1 -->
<rect x="255" y="208" width="170" height="24" rx="12" fill="#412402" stroke="#FAC775" stroke-width="0.5"/>
<text x="340" y="220" class="sub" fill="#FAC775" dominant-baseline="central">▷ confirm scope &amp; workflow</text>
<line x1="340" y1="232" x2="340" y2="246" class="ln" marker-end="url(#arrow)"/>

<!-- GOVERNED CORE container -->
<rect x="140" y="246" width="400" height="246" rx="10" fill="#04342C" stroke="#5DCAA5" stroke-width="1" stroke-dasharray="4 3"/>
<text x="340" y="264" class="sm" fill="#5DCAA5" text-anchor="middle">Governed analytical core — authority in rules, not fluency</text>

<rect x="180" y="276" width="320" height="30" rx="6" fill="#9FE1CB" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="340" y="291" class="sub" fill="#9FE1CB" dominant-baseline="central">Orchestrator &amp; state · enforces stage hand-offs</text>
<line x1="340" y1="306" x2="340" y2="318" class="ln" marker-end="url(#arrow)"/>

<rect x="190" y="318" width="300" height="44" rx="6" fill="#9FE1CB" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="340" y="336" class="ttl" fill="#9FE1CB" dominant-baseline="central">Workflow library</text>
<text x="340" y="352" class="sub" fill="#5DCAA5" dominant-baseline="central">formalised analytical recipes</text>
<line x1="340" y1="362" x2="340" y2="374" class="ln" marker-end="url(#arrow)"/>

<rect x="190" y="374" width="300" height="44" rx="6" fill="#9FE1CB" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="340" y="392" class="ttl" fill="#9FE1CB" dominant-baseline="central">Deterministic query compiler</text>
<text x="340" y="408" class="sub" fill="#5DCAA5" dominant-baseline="central">schema-safe · rule-bound SQL</text>
<line x1="340" y1="418" x2="340" y2="430" class="ln" marker-end="url(#arrow)"/>

<rect x="190" y="430" width="300" height="44" rx="6" fill="#9FE1CB" stroke="#5DCAA5" stroke-width="1"/>
<text x="340" y="448" class="ttl" fill="#9FE1CB" dominant-baseline="central">MCP gateway</text>
<text x="340" y="464" class="sub" fill="#5DCAA5" dominant-baseline="central">controlled · auditable data access</text>

<!-- core -> data -->
<line x1="340" y1="474" x2="340" y2="504" class="ln" marker-end="url(#arrow)"/>

<!-- GOVERNED DATA -->
<rect x="190" y="504" width="300" height="44" rx="6" fill="#9FE1CB" stroke="#5DCAA5" stroke-width="0.5"/>
<g stroke="#5DCAA5" stroke-width="1" fill="none">
<ellipse cx="213" cy="519" rx="8" ry="3"/>
<path d="M205 519 V533"/><path d="M221 519 V533"/>
<path d="M205 533 a8 3 0 0 0 16 0"/>
</g>
<text x="352" y="522" class="ttl" fill="#9FE1CB" dominant-baseline="central">Governed data — Dimensions · BigQuery</text>
<text x="352" y="538" class="sub" fill="#5DCAA5" dominant-baseline="central">versioned snapshots · logged queries</text>
<line x1="340" y1="548" x2="340" y2="562" class="ln" marker-end="url(#arrow)"/>

<!-- VALIDATION -->
<rect x="190" y="562" width="300" height="44" rx="6" fill="#9FE1CB" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="340" y="580" class="ttl" fill="#9FE1CB" dominant-baseline="central">Validation &amp; QA</text>
<text x="340" y="596" class="sub" fill="#5DCAA5" dominant-baseline="central">result checked vs inputs &amp; assumptions</text>
<line x1="340" y1="606" x2="340" y2="620" class="ln" marker-end="url(#arrow)"/>

<!-- gate 2 -->
<rect x="255" y="620" width="170" height="24" rx="12" fill="#412402" stroke="#FAC775" stroke-width="0.5"/>
<text x="340" y="632" class="sub" fill="#FAC775" dominant-baseline="central">▷ review before release</text>
<line x1="340" y1="644" x2="340" y2="658" class="ln" marker-end="url(#arrow)"/>

<!-- OUTPUT -->
<rect x="210" y="658" width="260" height="40" rx="6" fill="#2C2C2A" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="673" class="ttl" fill="#B4B2A9" dominant-baseline="central">Validated, documented result</text>
<text x="340" y="687" class="sub" fill="#888780" dominant-baseline="central">traceable to every decision</text>

<!-- return path to user -->
<path d="M470 678 H560 Q600 678 600 638 V154 Q600 114 560 114 H432" class="ln" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="615" y="400" class="sm" fill="#888780" text-anchor="middle" transform="rotate(-90 615 400)">validated answer returns to the user</text>

</svg>
