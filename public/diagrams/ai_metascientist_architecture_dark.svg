  <title
     id="title1">The AI metascientist — governed architecture</title>
  <desc
     id="desc1">Conversational interpretation sits at the border as the only AI layer; a governed analytical core (orchestrator, workflow library, deterministic query compiler, MCP gateway) holds methodological authority in rules; validation and human gates check the result before it returns to the user.</desc>
